services:
  blockboard:
    image: ghcr.io/motues/blockboard:latest
    container_name: blockboard
    restart: always
    ports:
      # 换对外端口改左边，例如 "8080:3000"；右边 3000 是容器内部端口
      - "3000:3000"
    environment:
      - PORT=3000
      # - DEV_PASSWORD=change-me
    volumes:
      # 配置文件
      - ./data:/app/data
      - game-config:/app/game-config.json

volumes:
  game-config:
